name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check files
        run: |
          echo "Building CI/CD Demo"
          ls -la

      - name: Validate HTML
        run: |
          test -f index.html
          test -f Dockerfile
          echo "Validation successful!"

      - name: Build Docker image
        run: |
          docker build -t cicd-demo:latest .
